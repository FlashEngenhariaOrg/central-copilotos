name: Security Scans

# Só no PR: a main recebe código apenas por PR já escaneado (o scan no merge repetia o mesmo código).
on:
  pull_request:
  workflow_dispatch:

jobs:
  security-scan:
    # Só na organização: no espelho pessoal o job é pulado (sem falha e sem e-mail).
    if: github.repository_owner == 'FlashEngenhariaOrg'
    uses: ./.github/workflows/security-scan-reusable.yml
    permissions:
      contents: read
      security-events: write
      actions: read
